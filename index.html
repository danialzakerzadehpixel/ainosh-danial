<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>آینوش و دانیال | دعوتنامه عروسی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Vazirmatn,sans-serif;background:#050505}
.app{width:100vw;height:100vh;position:relative;background:#050505}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.envelope-screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#33291d 0,#0d0b09 48%,#030303 100%);transition:opacity 1s,visibility 1s;cursor:pointer}
.envelope-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.envelope-screen img{width:100vw;height:100vh;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.hint-overlay{position:absolute;bottom:8%;left:0;width:100%;text-align:center;color:#d9c9aa;font-size:14px;letter-spacing:.3px;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,0.8)}
.hint-overlay b{display:block;font-family:Amiri,serif;font-size:25px;margin-bottom:6px}
.main{position:relative;width:100vw;height:100vh;overflow-y:auto;overflow-x:hidden;opacity:0;transform:translateY(25px);transition:opacity 1.2s .45s,transform 1.2s .45s;pointer-events:none}
.main.visible{opacity:1;transform:none;pointer-events:auto}
.hero{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:28px 18px 38px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#050505 92%),url("couple.jpeg") center 20%/cover no-repeat;filter:grayscale(1);transform:scale(1.02);opacity:.86}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#0000 0,#0005 58%,#000 100%)}
.topbar,.hero-content{position:relative;z-index:2}
.topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;direction:ltr}
.icon{width:42px;height:42px;border:1px solid #b99a6766;border-radius:50%;background:#09080799;color:#d9c49e;display:grid;place-items:center;backdrop-filter:blur(8px);cursor:pointer}
.hero-content{width:min(720px,100%);text-align:center}
.kicker{font-family:Amiri,serif;font-size:17px;color:#d2bd98;letter-spacing:3px}
.names{font-family:Amiri,serif;font-size:clamp(48px,13vw,88px);line-height:1.05;margin:10px 0 15px;text-shadow:0 4px 25px #000}
.orn{color:#c1a06a;font-size:25px;margin:3px}
.date{font-family:Amiri,serif;font-size:22px;color:#eadcc0}
.sub{font-size:13px;color:#c8b99d;margin-top:8px}
.card{max-width:760px;margin:-1px auto 0;padding:42px 18px 80px;background:linear-gradient(#050505,#0b0907);text-align:center}
.section-title{font-family:Amiri,serif;font-size:25px;color:#d9c49e;margin:0 0 20px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.unit{border:1px solid #b99a675c;padding:13px 4px;background:#0f0c09;border-radius:4px}
.num{font-family:Amiri,serif;font-size:31px;color:#ead7b4}
.label{font-size:10px;color:#a9997f;letter-spacing:1px;margin-top:3px}
.venue{margin:55px 0 0}
.venue-name{font-family:Amiri,serif;font-size:27px}
.venue-en{font-size:13px;color:#a99576;margin-top:0}
.map-buttons{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
.map-btn{color:#dfceb0;border:1px solid #b99a675c;padding:11px 16px;border-radius:999px;text-decoration:none;font-size:12px;background:#100d0a}
.footer{padding-top:55px;color:#776b59;font-size:11px}
.music-note{position:fixed;bottom:20px;left:20px;z-index:10}
.music-note.playing{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:700px){.hero{min-height:900px}.hero:before{background-position:center 26%}.card{padding-left:30px;padding-right:30px}}
@media(max-width:380px){.countdown{gap:4px}.num{font-size:26px}.unit{padding:10px 2px}}
</style>
</head>
<body>
<div class="app">
<div class="noise"></div>
<section class="envelope-screen" id="envelopeScreen">
  <img src="splash.webp.webp" alt="پاکت نامه">
  <div class="hint-overlay">
    <b>دعوتنامه عروسی</b>
    برای ورود، روی پاکت کلیک کنید
  </div>
</section>
<main class="main" id="main">
  <section class="hero">
    <div class="topbar">
      <button class="icon music-note" id="musicBtn" aria-label="موسیقی">♫</button>
      <button class="icon" id="menuBtn" aria-label="اطلاعات">☰</button>
    </div>
    <div class="hero-content">
      <div class="kicker">THE BEGINNING OF FOREVER</div>
      <div class="names">آینوش &amp; دانیال</div>
      <div class="orn">⌁ ❦ ⌁</div>
      <div class="date">۱۰ مهر ۱۴۰۵</div>
      <div class="sub">ساعت ۱۹:۰۰</div>
    </div>
  </section>
  <section class="card">
    <h2 class="section-title">تا آغاز یک خاطره‌ی ماندگار</h2>
    <div class="countdown">
      <div class="unit"><div class="num" id="days">--</div><div class="label">DAYS</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">HOURS</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTES</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">SECONDS</div></div>
    </div>
    <div class="venue">
      <div class="section-title">مراسم ما</div>
      <div class="venue-name">تالار فرش قرمز</div>
      <div class="venue-en">Red Carpet</div>
      <div class="map-buttons">
        <a class="map-btn" href="https://www.google.com/maps/place//data=!4m2!3m1!1s0x3fbc4b61e82d70f9:0x4f22546a30003f?entry=s&sa=X&ved=2ahUKEwj6mLyvuqOWAxVyTqQEHTYfBlYQ4kB6BAgVEAA&hl=fa&g_ep=Eg1tbF9yMDI2MDgxMV8wIOC7DCoASAJQAg%3D%3D" target="_blank" rel="noopener">Google Maps</a>
        <a class="map-btn" href="https://www.waze.com/ul?q=%D8%AA%D8%A7%D9%84%D8%A7%D8%B1%20%D9%81%D8%B1%D8%B4%20%D9%82%D8%B1%D9%85%D8%B2" target="_blank" rel="noopener">Waze</a>
        <a class="map-btn" href="https://maps.apple.com/?q=%D8%AA%D8%A7%D9%84%D8%A7%D8%B1%20%D9%81%D8%B1%D8%B4%20%D9%82%D8%B1%D9%85%D8%B2" target="_blank" rel="noopener">Apple Maps</a>
      </div>
    </div>
    <div class="footer">آینوش و دانیال • ۱۴۰۵</div>
  </section>
</main>
<audio id="audio" src="wedding-song.mp3" preload="auto" loop></audio>
</div>
<script>
const target = new Date("2026-10-02T19:00:00+03:30").getTime();
function pad(n){return String(n).padStart(2,"0")}
function tick(){
  let d=Math.max(0,target-Date.now());
  const days=Math.floor(d/86400000); d%=86400000;
  const hours=Math.floor(d/3600000); d%=3600000;
  const minutes=Math.floor(d/60000); d%=60000;
  const seconds=Math.floor(d/1000);
  document.getElementById("days").textContent=days;
  document.getElementById("hours").textContent=pad(hours);
  document.getElementById("minutes").textContent=pad(minutes);
  document.getElementById("seconds").textContent=pad(seconds);
}
tick(); setInterval(tick,1000);

const screen=document.getElementById("envelopeScreen");
const main=document.getElementById("main");
const audio=document.getElementById("audio");
const musicBtn=document.getElementById("musicBtn");
let opened=false;
function openInvite(){
 if(opened)return; opened=true;
 screen.classList.add("hidden");
 main.classList.add("visible");
 audio.volume=.55;
 audio.play().then(()=>musicBtn.classList.add("playing")).catch(()=>{});
}
screen.addEventListener("click",openInvite);
musicBtn.addEventListener("click",e=>{
 e.stopPropagation();
 if(audio.paused){audio.play().then(()=>musicBtn.classList.add("playing"))}
 else{audio.pause();musicBtn.classList.remove("playing")}
});
document.getElementById("menuBtn").addEventListener("click",()=>{
 document.querySelector(".venue").scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
