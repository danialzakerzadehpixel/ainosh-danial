:root{--bg:#090807;--gold:#c7a86d;--cream:#f1e7d1}
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:var(--cream);font-family:Vazirmatn,sans-serif;overflow-x:hidden}

/* =========================================================
   ENVELOPE — CINEMATIC 3D (FIXED SPLIT METHOD)
========================================================= */
.envelope-screen{
  position:fixed; inset:0; z-index:50;
  background:#090807;
  cursor:pointer;
  overflow:hidden;
}

.envelope-wrapper{
  position:absolute; left:50%; top:50%;
  width:min(70vw, 650px); aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  transition: all 1.4s cubic-bezier(.2,.8,.2,1);
  /* مطمئن میشیم عکس‌های اضافی وسطش دیده نشن */
  overflow: hidden;
}

/* نیمه بالای عکس پاکت برای درب (با استفاده از تگ img) */
.envelope-flap{
  position:absolute; top:0; left:0; width:100%; height:50%;
  overflow:hidden;
  transform-origin:top center; transform:rotateX(0deg);
  transition:transform 1.3s cubic-bezier(.2,.8,.2,1);
  backface-visibility:hidden; z-index:4;
}
.envelope-flap img{
  display:block; width:100%; height:200%;
  object-fit:cover; object-position:top center;
}
