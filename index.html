<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آینوش و دانیال | دعوتنامه عروسی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0908;color:#f1e7d1;font-family:Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column}

.splash{position:fixed;inset:0;background:#0b0908;display:flex;justify-content:center;align-items:center;flex-direction:column;cursor:pointer;z-index:999;transition:opacity 1s}
.splash.hidden{opacity:0;pointer-events:none}
.splash img{max-width:90%;max-height:80vh;border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,.8);border:2px solid #b99a67}
.splash span{color:#b99a67;margin-top:20px;font-size:16px;letter-spacing:2px}

.main{display:none;max-width:800px;width:100%;padding:30px 20px;text-align:center}
.main.show{display:block;animation:fade .8s}
@keyframes fade{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.hero{background:linear-gradient(180deg,#0000 30%,#0b0908 100%),url('couple.jpeg') center/cover no-repeat;min-height:80vh;border-radius:16px;display:flex;align-items:flex-end;padding:40px 20px;margin-bottom:30px}
.hero h1{font-size:clamp(36px,10vw,70px);font-family:serif;text-shadow:0 4px 30px #000;width:100%}
.hero h1 small{display:block;font-size:20px;color:#d4af37;margin-top:10px}

.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0}
.box{background:#14100c;border:1px solid #b99a6755;padding:15px 5px;border-radius:8px}
.box .num{font-size:32px;font-family:serif;color:#d4af37}
.box .lbl{font-size:11px;color:#a99576}

.venue{background:#14100c;padding:25px;border-radius:12px;margin:20px 0;border:1px solid #b99a6755}
.venue h3{color:#d4af37;font-size:22px;margin-bottom:10px}
.venue p{margin:5px 0;color:#d9c9aa}
.map-btn{display:inline-block;margin:5px;padding:8px 18px;border:1px solid #b99a6755;border-radius:20px;color:#dfceb0;text-decoration:none;font-size:13px}

.music-btn{position:fixed;bottom:20px;left:20px;background:#14100c;border:1px solid #b99a6755;color:#d9c49e;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}
.music-btn.playing{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== صفحه اول ===== -->
<div class="splash" id="splash" onclick="openSite()">
  <img src="splash.webp.png" alt="دعوتنامه">
  <span>✦ برای باز کردن کلیک کنید ✦</span>
</div>

<!-- ===== صفحه اصلی ===== -->
<div class="main" id="main">
  <div class="hero">
    <h1>آینوش &amp; دانیال <small>۱۰ مهر ۱۴۰۵ • ساعت ۱۹:۰۰</small></h1>
  </div>

  <div class="countdown">
    <div class="box"><div class="num" id="d">--</div><div class="lbl">روز</div></div>
    <div class="box"><div class="num" id="h">--</div><div class="lbl">ساعت</div></div>
    <div class="box"><div class="num" id="m">--</div><div class="lbl">دقیقه</div></div>
    <div class="box"><div class="num" id="s">--</div><div class="lbl">ثانیه</div></div>
  </div>

  <div class="venue">
    <h3>🏛 تالار فرش قرمز</h3>
    <p>Red Carpet</p>
    <div>
      <a class="map-btn" href="https://maps.google.com" target="_blank">📍 Google Maps</a>
      <a class="map-btn" href="https://waze.com" target="_blank">📍 Waze</a>
    </div>
  </div>

  <p style="color:#776b59;font-size:12px;margin-top:30px">آینوش و دانیال • ۱۴۰۵</p>
</div>

<button class="music-btn" id="musicBtn" onclick="toggleMusic()">♫</button>
<audio id="audio" src="wedding-song.mp3" loop></audio>

<script>
// تایمر
const target = new Date("2026-10-02T19:00:00+03:30").getTime();
setInterval(() => {
  let d = Math.max(0, target - Date.now());
  document.getElementById("d").textContent = Math.floor(d / 86400000);
  d %= 86400000;
  document.getElementById("h").textContent = String(Math.floor(d / 3600000)).padStart(2, "0");
  d %= 3600000;
  document.getElementById("m").textContent = String(Math.floor(d / 60000)).padStart(2, "0");
  d %= 60000;
  document.getElementById("s").textContent = String(Math.floor(d / 1000)).padStart(2, "0");
}, 1000);

// باز کردن سایت
function openSite() {
  document.getElementById("splash").classList.add("hidden");
  document.getElementById("main").classList.add("show");
  const audio = document.getElementById("audio");
  audio.volume = .5;
  audio.play().then(() => document.getElementById("musicBtn").classList.add("playing")).catch(() => {});
}

// موسیقی
function toggleMusic() {
  const audio = document.getElementById("audio");
  const btn = document.getElementById("musicBtn");
  if (audio.paused) { audio.play(); btn.classList.add("playing"); }
  else { audio.pause(); btn.classList.remove("playing"); }
}
</script>
</body>
</html>
